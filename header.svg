<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Dafa Dwi Andika - Portofolio" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1330"/>
      <stop offset="1" stop-color="#101c40"/>
      <animate attributeName="x2" values="1;0.6;1" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a67c28"/>
      <stop offset="0.5" stop-color="#f0dba5"/>
      <stop offset="1" stop-color="#d4af62"/>
      <animate attributeName="x1" values="-1;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4af62" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d4af62" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="360" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="358" rx="21" fill="none" stroke="#27396a" stroke-width="2"/>

  <circle cx="820" cy="90" r="160" fill="url(#glow)">
    <animate attributeName="r" values="140;180;140" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- konstelasi -->
  <g fill="#d4af62">
    <circle cx="90" cy="70" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="140" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="50" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="110" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="60" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="130" r="1.8"><animate attributeName="opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="60" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="250" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="290" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="300" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="4.2s" repeatCount="indefinite"/></circle>
  </g>
  <g stroke="#d4af62" stroke-opacity="0.18" stroke-width="1">
    <line x1="90" y1="70" x2="190" y2="140"/>
    <line x1="190" y1="140" x2="300" y2="50"/>
    <line x1="300" y1="50" x2="420" y2="110"/>
    <line x1="420" y1="110" x2="560" y2="60"/>
    <line x1="560" y1="60" x2="690" y2="130"/>
    <line x1="690" y1="130" x2="880" y2="60"/>
  </g>

  <!-- orbit -->
  <g transform="translate(850 220)">
    <circle r="70" fill="none" stroke="#d4af62" stroke-opacity="0.35" stroke-dasharray="4 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle r="46" fill="none" stroke="#6f8fe0" stroke-opacity="0.35" stroke-dasharray="2 6">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="0" r="5" fill="#f0dba5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
    <text y="12" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="url(#gold)">DDA</text>
  </g>

  <text x="60" y="130" font-family="Verdana, Arial, sans-serif" font-size="14" letter-spacing="6" fill="#8997b8">PORTOFOLIO</text>
  <text x="60" y="215" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="700" fill="url(#gold)">Dafa Dwi Andika</text>
  <line x1="62" y1="238" x2="62" y2="238" stroke="#d4af62" stroke-width="3" stroke-linecap="round">
    <animate attributeName="x2" values="62;520;62" dur="6s" repeatCount="indefinite"/>
  </line>

  <!-- peran bergantian -->
  <g font-family="Verdana, Arial, sans-serif" font-size="22" fill="#c7d1e8">
    <text x="60" y="285" opacity="0">Mahasiswa Ilmu Komputer USU
      <animate attributeName="opacity" values="0;1;1;0;0;0;0;0;0" keyTimes="0;0.04;0.2;0.25;0.5;0.75;0.9;0.95;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="60" y="285" opacity="0">Ketua English Club
      <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.25;0.3;0.45;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="60" y="285" opacity="0">Koordinator Olimpiade
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.55;0.7;0.75;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="60" y="285" opacity="0">Calon Full Stack Developer
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.8;0.95;1" dur="12s" repeatCount="indefinite"/></text>
  </g>
  <rect x="60" y="300" width="6" height="3" fill="#d4af62">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
